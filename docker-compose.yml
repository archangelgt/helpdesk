services:
  # App en host :3000 (evita conflictos frecuentes con :8080 en Linux).
  # PocketBase admin en host :8090. Ambos puertos los publica `api`;
  # PocketBase usa network_mode: service:api (misma red, DB en volumen Docker).
  api:
    build:
      context: ./api
    container_name: helpdesk-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:8080"
      - "${PB_PORT:-8090}:8090"
    environment:
      HTTP_ADDR: ":8080"
      POCKETBASE_URL: http://127.0.0.1:8090
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@helpdesk.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-helpdesk-admin-change-me}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  pocketbase:
    build:
      context: ./docker/pocketbase
    container_name: helpdesk-pocketbase
    restart: unless-stopped
    network_mode: "service:api"
    volumes:
      - helpdesk_pb_data:/pb_data
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@helpdesk.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-helpdesk-admin-change-me}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  helpdesk_pb_data:
    name: helpdesk_pb_data
