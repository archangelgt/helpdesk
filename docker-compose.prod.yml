# Producción (erpsys / support.erpsys.pro).
# Apache hace TLS + ProxyPass a 127.0.0.1:3000.
#
#   cp .env.example .env   # rellenar secretos y API_BIND=127.0.0.1
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Ver docs/DEPLOY_ERPSYS.md

services:
  api:
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:?Set PB_ADMIN_EMAIL in .env}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:?Set PB_ADMIN_PASSWORD in .env}
    restart: always

  pocketbase:
    restart: always
