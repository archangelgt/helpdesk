{{define "nav"}}
<header>
  <div class="brand">HELPDESK</div>
  <nav>
    <a href="/">Inicio</a>
    <a href="/categories">Categorías</a>
    <a href="/tickets">Tickets</a>
  </nav>

{{define "styles"}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --ink: #e8eef4;
    --muted: #8b9aab;
    --line: #2a3542;
    --accent: #3d9b8f;
    --accent-2: #e2b15a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DM Sans", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #1a2a33 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #24301f 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 1.75rem;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    background: rgba(15,20,25,.85);
  }
  .brand {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    letter-spacing: .04em;
  }
  nav { display: flex; gap: 1.25rem; }
  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
  .lead { color: var(--muted); margin: 0 0 1.75rem; max-width: 42rem; }
  .grid { display: grid; gap: 1.25rem; }
  @media (min-width: 800px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .35rem; }
  input, select, textarea {
    width: 100%;
    background: #0f1419;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: .65rem .75rem;
    font: inherit;
    margin-bottom: .9rem;
  }
  textarea { min-height: 100px; resize: vertical; }
  button, .btn {
    appearance: none;
    border: 0;
    background: var(--accent);
    color: #041210;
    font-weight: 700;
    padding: .7rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    display: inline-block;
  }
  button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .65rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .flash { background: rgba(61,155,143,.15); border: 1px solid rgba(61,155,143,.4); color: #b6e6df; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .error { background: rgba(217,107,107,.12); border: 1px solid rgba(217,107,107,.4); color: #f0c2c2; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .stat { font-family: "IBM Plex Mono", monospace; font-size: 1.6rem; margin: .35rem 0 1rem; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block;
    padding: .15rem .5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: .75rem;
    color: var(--accent-2);
    font-family: "IBM Plex Mono", monospace;
  }
</style>
{{end}}
