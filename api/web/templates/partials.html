{{define "nav"}}
<header class="topbar">
  <div class="brand"><a href="/board">HELPDESK</a></div>
  <nav>
    <a class="{{activeNav .Nav "board"}}" href="/board">Tablero</a>
    <a class="{{activeNav .Nav "list"}}" href="/tickets">Lista</a>
    <a class="{{activeNav .Nav "new"}}" href="/tickets/new">Nuevo</a>
    <a class="{{activeNav .Nav "categories"}}" href="/categories">Categorías</a>
  </nav>
</header>
{{end}}

{{define "styles"}}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #dfe5e1;
    --bg-deep: #cfd8d2;
    --ink: #152018;
    --muted: #5c6b62;
    --panel: #f4f7f5;
    --panel-2: #ebf0ec;
    --line: #b7c4bc;
    --accent: #b54a2a;
    --accent-ink: #fff7f2;
    --ok: #2f6b4f;
    --warn: #9a6b1f;
    --info: #2a5f78;
    --shadow: 0 10px 30px rgba(21, 32, 24, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sora", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% 0%, rgba(181,74,42,.12), transparent 55%),
      radial-gradient(700px 380px at 100% 0%, rgba(47,107,79,.10), transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 20;
    background: rgba(244,247,245,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand a {
    font-family: "Newsreader", serif; font-weight: 600; font-size: 1.35rem;
    color: var(--ink); letter-spacing: .02em; text-decoration: none;
  }
  nav { display: flex; gap: .35rem; flex-wrap: wrap; }
  nav a {
    color: var(--muted); padding: .45rem .8rem; border-radius: 999px;
    font-size: .9rem; font-weight: 500; text-decoration: none;
  }
  nav a:hover { background: rgba(21,32,24,.06); color: var(--ink); text-decoration: none; }
  nav a.is-active { background: var(--ink); color: #f4f7f5; }
  main.page { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.25rem 3.5rem; }
  main.board-page { max-width: none; padding: 1.25rem 1rem 2.5rem; }
  h1 {
    font-family: "Newsreader", serif; font-weight: 600;
    font-size: clamp(1.8rem, 3vw, 2.4rem); margin: 0 0 .35rem; letter-spacing: -.02em;
  }
  h2 { font-size: 1rem; margin: 0 0 .85rem; font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 1.25rem; max-width: 40rem; line-height: 1.5; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: end;
    justify-content: space-between; margin-bottom: 1.25rem;
  }
  .seg {
    display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: .2rem; gap: .15rem;
  }
  .seg a {
    padding: .45rem .9rem; border-radius: 999px; color: var(--muted);
    font-size: .85rem; font-weight: 600; text-decoration: none;
  }
  .seg a.is-on { background: var(--ink); color: #f4f7f5; }
  .btn {
    appearance: none; border: 0; display: inline-flex; align-items: center; gap: .4rem;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700;
    padding: .7rem 1.05rem; border-radius: 999px; cursor: pointer; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.05); text-decoration: none; }
  .btn.ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  .flash, .error {
    padding: .85rem 1rem; border-radius: 12px; margin-bottom: 1rem; font-size: .92rem;
  }
  .flash { background: #e4f2ea; color: #1e4d35; border: 1px solid #b7d8c4; }
  .error { background: #f8e6e1; color: #7a2e1c; border: 1px solid #e2b5a8; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 1.15rem; box-shadow: var(--shadow);
  }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  input, select, textarea {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: .75rem .85rem; font: inherit; margin-bottom: .9rem;
  }
  textarea { min-height: 120px; resize: vertical; }
  .grid { display: grid; gap: 1rem; }
  @media (min-width: 860px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .create-layout { grid-template-columns: 1.3fr .7fr; align-items: start; }
  }
  .muted { color: var(--muted); }
  .pill, .badge {
    display: inline-flex; align-items: center; gap: .25rem;
    padding: .2rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 600;
    border: 1px solid var(--line); background: #fff;
  }
  .badge { font-family: "Sora", sans-serif; letter-spacing: .02em; }
  .st-open { color: var(--info); border-color: #9ec2d3; background: #e8f3f8; }
  .st-wait { color: var(--warn); border-color: #e0c48a; background: #f8efd9; }
  .st-prog { color: var(--ok); border-color: #9ecbb3; background: #e6f4ec; }
  .st-done { color: #355f3f; border-color: #9dbea8; background: #e8f5ee; }
  .st-closed { color: var(--muted); border-color: var(--line); background: #eef1ef; }
  .pr-crit { color: #8b1e12; background: #f7ddd7; border-color: #e3a799; }
  .pr-high { color: #8a3b12; background: #f6e3d3; border-color: #e2b792; }
  .pr-mid { color: #6a5218; background: #f3ead0; border-color: #d7c48d; }
  .pr-low { color: #355245; background: #e4eee8; border-color: #b7c9be; }

  /* Board */
  .board {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    align-items: start;
  }
  .column {
    background: rgba(244,247,245,.72); border: 1px solid var(--line);
    border-radius: 18px; padding: .75rem; min-height: 280px;
  }
  .column-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: .35rem .45rem .85rem; position: sticky; top: 64px;
    background: rgba(223,229,225,.92); backdrop-filter: blur(6px);
    border-radius: 12px; margin: -.15rem -.15rem .7rem; z-index: 2;
  }
  .column-head h2 { margin: 0; font-size: .95rem; }
  .count {
    min-width: 1.6rem; height: 1.6rem; border-radius: 999px;
    display: inline-grid; place-items: center; font-size: .75rem; font-weight: 700;
    background: var(--ink); color: #f4f7f5;
  }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: .9rem; margin-bottom: .7rem; box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(21,32,24,.12); }
  .card-top { display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; }
  .card h3 {
    font-family: "Newsreader", serif; font-size: 1.05rem; font-weight: 600;
    margin: 0 0 .55rem; line-height: 1.25;
  }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card-meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .75rem; }
  .move {
    display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .35rem;
    padding-top: .65rem; border-top: 1px dashed var(--line);
  }
  .move form { margin: 0; }
  .move button {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); border-radius: 999px; padding: .28rem .55rem;
    font: inherit; font-size: .68rem; font-weight: 600; cursor: pointer;
  }
  .move button:hover { border-color: var(--accent); color: var(--accent); }

  /* Create */
  .hero-create {
    padding: 1.5rem; border-radius: 22px; margin-bottom: 1.25rem;
    background:
      linear-gradient(135deg, rgba(181,74,42,.14), transparent 55%),
      var(--panel);
    border: 1px solid var(--line);
  }
  .hint-box {
    background: #fff; border: 1px dashed var(--line); border-radius: 16px;
    padding: 1rem; color: var(--muted); font-size: .92rem; line-height: 1.55;
  }
  .status-rail {
    display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0 1rem;
  }
  .status-rail form { margin: 0; }
  .status-rail button {
    appearance: none; border: 1px solid var(--line); background: #fff;
    border-radius: 999px; padding: .55rem .9rem; font: inherit; font-weight: 600;
    cursor: pointer; color: var(--ink);
  }
  .status-rail button.current {
    background: var(--ink); color: #f4f7f5; border-color: var(--ink);
  }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .7rem .35rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  .filters { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
  .filters .btn { margin-bottom: .9rem; }
  .timeline { display: flex; flex-direction: column; gap: .7rem; }
  .comment { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: .85rem; }
  .comment.sistema { border-style: dashed; opacity: .9; }
  .comment.cliente { border-color: #c9dfd2; background: #f3faf6; }
  .meta { font-size: .75rem; color: var(--muted); margin-bottom: .35rem; }
</style>
{{end}}
