  <nav>

{{define "styles"}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --ink: #e8eef4;
    --muted: #8b9aab;
    --line: #2a3542;
    --accent: #3d9b8f;
    --accent-2: #e2b15a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DM Sans", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #1a2a33 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #24301f 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.1rem 1.75rem; border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px); position: sticky; top: 0;
    background: rgba(15,20,25,.9); z-index: 10;
  }
  .brand { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: .04em; }
  nav { display: flex; gap: 1.25rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }
  h1 { font-size: 1.65rem; margin: 0 0 .4rem; }
  h2 { font-size: 1.05rem; margin: 0 0 1rem; }
  .lead { color: var(--muted); margin: 0 0 1.5rem; max-width: 46rem; }
  .grid { display: grid; gap: 1.1rem; }
  @media (min-width: 860px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-aside { grid-template-columns: 1.2fr .9fr; }
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 1.15rem;
  }
  label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: .3rem; }
  input, select, textarea {
    width: 100%; background: #0f1419; border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: .6rem .7rem;
    font: inherit; margin-bottom: .8rem;
  }
  textarea { min-height: 90px; resize: vertical; }
  button, .btn {
    appearance: none; border: 0; background: var(--accent); color: #041210;
    font-weight: 700; padding: .65rem 1rem; border-radius: 8px;
    cursor: pointer; font: inherit; display: inline-block;
  }
  button.secondary, .btn.secondary {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .7rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .flash { background: rgba(61,155,143,.15); border: 1px solid rgba(61,155,143,.4); color: #b6e6df; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .error { background: rgba(217,107,107,.12); border: 1px solid rgba(217,107,107,.4); color: #f0c2c2; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .stat { font-family: "IBM Plex Mono", monospace; font-size: 1.5rem; margin: .2rem 0 .6rem; }
  .muted { color: var(--muted); }
  .pill, .badge {
    display: inline-block; padding: .18rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); font-size: .75rem;
    font-family: "IBM Plex Mono", monospace;
  }
  .badge { color: var(--accent-2); }
  .st-open { color: #7ec8ff; border-color: #2a4a66; }
  .st-wait { color: #e2b15a; border-color: #5a4a2a; }
  .st-prog { color: #3d9b8f; border-color: #1f4a44; }
  .st-done { color: #8fd49a; border-color: #2a4a32; }
  .st-closed { color: #8b9aab; border-color: #2a3542; }
  .filters { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; margin-bottom: 1rem; }
  .filters button { margin-bottom: .8rem; }
  .timeline { display: flex; flex-direction: column; gap: .75rem; }
  .comment {
    border: 1px solid var(--line); border-radius: 10px; padding: .85rem;
    background: #121820;
  }
  .comment.sistema { opacity: .85; border-style: dashed; }
  .comment.cliente { border-color: rgba(61,155,143,.45); }
  .meta { font-size: .78rem; color: var(--muted); margin-bottom: .35rem; }
  .quick-status form { display: inline; }
  .quick-status button { margin: 0 .2rem .35rem 0; padding: .4rem .65rem; font-size: .8rem; }
</style>
{{end}}
