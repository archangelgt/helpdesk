{{define "prefs.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} · Helpdesk</title>
  {{template "styles" .}}
  {{template "theme_boot" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="page" style="max-width:560px">
    <h1>{{call .T "prefs.title"}}</h1>
    {{if .Flash}}<div class="flash">{{call .T "flash.saved"}}</div>{{end}}
    <form class="panel" method="post" action="/prefs">
      <label>{{call .T "prefs.lang"}}</label>
      <select name="lang">
        <option value="es" {{selected .Lang "es"}}>Español</option>
        <option value="en" {{selected .Lang "en"}}>English</option>
        <option value="pt" {{selected .Lang "pt"}}>Português</option>
      </select>
      <label>{{call .T "prefs.theme"}}</label>
      <select name="theme">
        <option value="light" {{selected .Theme "light"}}>{{call .T "prefs.light"}}</option>
        <option value="dark" {{selected .Theme "dark"}}>{{call .T "prefs.dark"}}</option>
        <option value="auto" {{selected .Theme "auto"}}>{{call .T "prefs.auto"}}</option>
      </select>
      <button class="btn" type="submit">{{call .T "prefs.save"}}</button>
    </form>
  </main>
</body>
</html>
{{end}}
