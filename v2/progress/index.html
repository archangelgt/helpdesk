<!doctype html>
<html lang="es" data-mode="light" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpdesk v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00387a; --primary-strong: #002c60; --primary-deep: #001f45; --primary-soft: #3d6eaa;
    --accent: #f26522;
    --bg: #f5f8fb; --surface: #ffffff; --surface-2: #eef3f8; --border: #d3d8dd;
    --text: #1d2733; --muted: #5d6b7a;
    --ok: #1f8a4c; --warn: #c27c0e; --idle: #9aa6b2;
  }
  [data-theme="orange"] { --primary: #c4501a; --primary-strong: #a3410f; --primary-deep: #7a300a; --primary-soft: #e07a45; --accent: #00387a; }
  [data-theme="green"]  { --primary: #1f7a4a; --primary-strong: #17633b; --primary-deep: #0f4a2b; --primary-soft: #4fa676; }
  [data-theme="purple"] { --primary: #5b3aa6; --primary-strong: #4a2e8a; --primary-deep: #36216a; --primary-soft: #8a6bd1; }
  [data-theme="pink"]   { --primary: #b0306e; --primary-strong: #922659; --primary-deep: #6d1c43; --primary-soft: #d9619b; }
  [data-theme="slate"]  { --primary: #3c4a5a; --primary-strong: #2f3b48; --primary-deep: #222b35; --primary-soft: #6b7c8f; }
  [data-mode="dark"] {
    --bg: #0f1722; --surface: #172231; --surface-2: #1e2c3e; --border: #2b3b50;
    --text: #e4ebf3; --muted: #9aabbd;
  }
  [data-mode="dark"] .phase.active, [data-mode="dark"] header { --primary-soft: #7fa6d6; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; }
  .bar { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; }
  .brand small { font-weight: 500; opacity: .8; margin-left: 8px; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .tools select, .tools button { font: inherit; font-size: 13px; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .tools select option { color: #1d2733; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
  .hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; }
  .hero h1 { margin: 0 0 6px; font-size: 22px; color: var(--primary); }
  [data-mode="dark"] .hero h1 { color: var(--text); }
  .hero p { margin: 0; color: var(--muted); }
  .ring { --p: 0; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); flex: none; }
  .ring span { width: 76px; height: 76px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .links a { font-size: 13px; text-decoration: none; color: var(--primary); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; background: var(--surface-2); }
  [data-mode="dark"] .links a { color: var(--text); }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 28px 0 12px; }
  .phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .phase { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .phase.active { border-color: var(--primary-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-soft) 25%, transparent); }
  .phase-head { display: flex; align-items: center; gap: 10px; }
  .phase-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .phase-title { font-weight: 600; }
  .phase-meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; margin: 12px 0 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .phase p { margin: 0; font-size: 14px; color: var(--muted); }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .pill.done { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .pill.in_progress { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.pending { background: var(--surface-2); color: var(--muted); }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  ul.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; }
  ul.tasks li:first-child { border-top: 0; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--idle); flex: none; margin-top: 2px; }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.in_progress { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
  li.done span.t { color: var(--muted); text-decoration: line-through; }
  .log { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 18px; }
  .log div { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .log div:first-child { border-top: 0; }
  .log time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">ERPSYS Helpdesk <small>v2</small></div>
    <div class="tools">
      <select id="lang" aria-label="Idioma">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
      <select id="theme" aria-label="Tema"></select>
      <button id="mode" type="button"></button>
    </div>
  </div>
</header>
<main>
  <section class="hero">
    <div class="ring" id="ring"><span id="ringText">0%</span></div>
    <div>
      <h1 data-i18n="title"></h1>
      <p id="subtitle"></p>
      <div class="links" id="links"></div>
    </div>
  </section>

  <h2 id="currentTitle"></h2>
  <div class="phase active" id="current"></div>

  <h2 data-i18n="phases"></h2>
  <div class="phases" id="phases"></div>

  <h2 data-i18n="log"></h2>
  <div class="log" id="log"></div>
</main>
<footer id="footer"></footer>

<script>
const T = {
  es: { title: "Avance del Helpdesk v2", subtitle: "Proyecto nuevo en la rama {b}. Última actualización: {d}.", phases: "Fases del roadmap", log: "Bitácora", current: "Fase actual", phase: "Fase", roadmap: "Roadmap", repo: "Código (rama v2)", database: "Base de datos v2", v1: "Helpdesk actual (v1)", done: "Hecho", in_progress: "En curso", pending: "Pendiente", light: "Modo oscuro", dark: "Modo claro", tasks: "{a} de {b} tareas", footer: "Esta página se reemplazará por la aplicación v2 cuando el MVP esté listo.", themes: { blue: "Azul", orange: "Naranja", green: "Verde", purple: "Morado", pink: "Rosa", slate: "Pizarra" } },
  en: { title: "Helpdesk v2 progress", subtitle: "New project on the {b} branch. Last update: {d}.", phases: "Roadmap phases", log: "Changelog", current: "Current phase", phase: "Phase", roadmap: "Roadmap", repo: "Code (v2 branch)", database: "v2 database", v1: "Current helpdesk (v1)", done: "Done", in_progress: "In progress", pending: "Pending", light: "Dark mode", dark: "Light mode", tasks: "{a} of {b} tasks", footer: "This page will be replaced by the v2 app once the MVP is ready.", themes: { blue: "Blue", orange: "Orange", green: "Green", purple: "Purple", pink: "Pink", slate: "Slate" } },
  pt: { title: "Progresso do Helpdesk v2", subtitle: "Projeto novo no branch {b}. Última atualização: {d}.", phases: "Fases do roadmap", log: "Registro", current: "Fase atual", phase: "Fase", roadmap: "Roadmap", repo: "Código (branch v2)", database: "Banco de dados v2", v1: "Helpdesk atual (v1)", done: "Concluído", in_progress: "Em andamento", pending: "Pendente", light: "Modo escuro", dark: "Modo claro", tasks: "{a} de {b} tarefas", footer: "Esta página será substituída pelo app v2 quando o MVP estiver pronto.", themes: { blue: "Azul", orange: "Laranja", green: "Verde", purple: "Roxo", pink: "Rosa", slate: "Ardósia" } }
};
const root = document.documentElement;
const store = { get: k => localStorage.getItem("hd2-" + k), set: (k, v) => localStorage.setItem("hd2-" + k, v) };
let lang = store.get("lang") || (navigator.language || "es").slice(0, 2);
if (!T[lang]) lang = "es";
root.dataset.theme = store.get("theme") || "blue";
root.dataset.mode = store.get("mode") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let data = null;

const fmt = (s, v) => s.replace(/\{(\w)\}/g, (_, k) => v[k] ?? "");
const tr = o => (o && (o[lang] || o.es)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function phasePercent(p) {
  if (p.status === "done") return 100;
  if (!p.tasks || !p.tasks.length) return 0;
  const score = p.tasks.reduce((s, t) => s + (t.status === "done" ? 1 : t.status === "in_progress" ? 0.5 : 0), 0);
  return Math.round(score / p.tasks.length * 100);
}

function render() {
  const t = T[lang];
  root.lang = lang;
  document.getElementById("lang").value = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  const themeSel = document.getElementById("theme");
  themeSel.innerHTML = Object.entries(t.themes).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  themeSel.value = root.dataset.theme;
  document.getElementById("mode").textContent = root.dataset.mode === "dark" ? t.dark : t.light;
  document.getElementById("footer").textContent = t.footer;
  if (!data) return;

  document.getElementById("subtitle").textContent = fmt(t.subtitle, { b: data.branch, d: data.updated });
  document.getElementById("links").innerHTML = Object.entries(data.links)
    .map(([k, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(t[k] || k)}</a>`).join("");

  const total = data.phases.reduce((s, p) => s + phasePercent(p), 0) / data.phases.length;
  const cur = data.phases.find(p => p.status === "in_progress") || data.phases[0];
  const curPct = phasePercent(cur);
  const ring = document.getElementById("ring");
  ring.style.setProperty("--p", curPct);
  document.getElementById("ringText").textContent = curPct + "%";
  ring.title = `${t.phase} ${cur.id}: ${curPct}% · total ${Math.round(total)}%`;

  document.getElementById("currentTitle").textContent = `${t.current}: ${t.phase} ${cur.id} · ${tr(cur.name)}`;
  const doneCount = (cur.tasks || []).filter(x => x.status === "done").length;
  document.getElementById("current").innerHTML = `
    <div class="phase-head"><div class="phase-num">${esc(cur.id)}</div><div class="phase-title">${esc(tr(cur.name))}</div>
      <div class="phase-meta">${fmt(t.tasks, { a: doneCount, b: (cur.tasks || []).length })} · ${esc(tr(cur.estimate))}</div></div>
    <div class="progress"><i style="width:${curPct}%"></i></div>
    <ul class="tasks">${(cur.tasks || []).map(x => `<li class="${x.status}"><span class="dot ${x.status}"></span><span class="t">${esc(tr(x.name))}</span></li>`).join("")}</ul>`;

  document.getElementById("phases").innerHTML = data.phases.map(p => {
    const pct = phasePercent(p);
    const summary = p.summary ? tr(p.summary) : (p.tasks || []).map(x => tr(x.name)).slice(0, 3).join(" · ") + "…";
    return `<div class="phase ${p === cur ? "active" : ""}">
      <div class="phase-head"><div class="phase-num">${esc(p.id)}</div><div class="phase-title">${esc(tr(p.name))}</div>
        <span class="phase-meta"><span class="pill ${p.status}">${t[p.status]}</span></span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <p>${esc(summary)}</p>
      <p style="margin-top:8px;font-size:12px">${esc(tr(p.estimate))}</p></div>`;
  }).join("");

  document.getElementById("log").innerHTML = data.log
    .map(l => `<div><time>${esc(l.date)}</time><span>${esc(tr(l.text))}</span></div>`).join("");
}

document.getElementById("lang").onchange = e => { lang = e.target.value; store.set("lang", lang); render(); };
document.getElementById("theme").onchange = e => { root.dataset.theme = e.target.value; store.set("theme", e.target.value); };
document.getElementById("mode").onclick = () => {
  root.dataset.mode = root.dataset.mode === "dark" ? "light" : "dark";
  store.set("mode", root.dataset.mode); render();
};

render();
fetch("progress.json", { cache: "no-store" }).then(r => r.json()).then(j => { data = j; render(); });
</script>
</body>
</html>
