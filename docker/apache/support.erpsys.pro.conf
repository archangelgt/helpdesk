# Apache vhost → contenedor Helpdesk (solo Docker en el host).
# Instalar:
#   sudo cp docker/apache/support.erpsys.pro.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#   sudo a2ensite support.erpsys.pro.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# El contenedor debe escuchar en 127.0.0.1:3000 (ver docker-compose.prod.yml).

<VirtualHost *:80>
    ServerName support.erpsys.pro

    # Redirigir todo a HTTPS (ajuste si usáis ACME webroot en /.well-known/)
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    ServerName support.erpsys.pro

    SSLEngine on
    # Ajusta a tus certificados (Let's Encrypt u otros de erpsys)
    SSLCertificateFile      /etc/letsencrypt/live/support.erpsys.pro/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/support.erpsys.pro/privkey.pem

    # Seguridad básica
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy al contenedor helpdesk-api (publicado en localhost)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Timeouts razonables (subidas de evidencias / archivos)
    ProxyTimeout 120

    ErrorLog  ${APACHE_LOG_DIR}/support.erpsys.pro-error.log
    CustomLog ${APACHE_LOG_DIR}/support.erpsys.pro-access.log combined
</VirtualHost>
