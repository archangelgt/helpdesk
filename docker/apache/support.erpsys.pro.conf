# Apache vhost → contenedor Helpdesk (solo Docker en el host).
#
# CentOS/RHEL (httpd — típico erpsys):
#   sudo cp docker/apache/support.erpsys.pro.conf /etc/httpd/conf.d/support.erpsys.pro.conf
#   # asegurar: proxy, proxy_http, ssl, headers, rewrite
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Debian/Ubuntu (apache2):
#   sudo cp docker/apache/support.erpsys.pro.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#   sudo a2ensite support.erpsys.pro.conf && sudo systemctl reload apache2
#
# Contenedor: 127.0.0.1:3000 (API_BIND=127.0.0.1). PocketBase admin NO se publica.

<VirtualHost *:80>
    ServerName support.erpsys.pro

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName support.erpsys.pro

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/support.erpsys.pro/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/support.erpsys.pro/privkey.pem

    SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!RC4:!3DES
    SSLHonorCipherOrder     on

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    # UI + API Go (contenedor). PB admin queda solo en 127.0.0.1:8090
    ProxyPass        / http://127.0.0.1:3000/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 120

    ErrorLog  logs/support.erpsys.pro-error.log
    CustomLog logs/support.erpsys.pro-access.log combined
</VirtualHost>
